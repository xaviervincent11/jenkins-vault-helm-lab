<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Jenkins Vault Helm Lab Architecture</title>
  <desc id="desc">Architecture diagram showing GitHub, Docker Desktop, a kind Kubernetes cluster, Jenkins, Vault, a Jenkins agent, Helm deployment, and a Python Flask application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .namespace { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .github { fill: #f3f4f6; stroke: #111827; }
      .jenkins { fill: #eef2ff; stroke: #4338ca; }
      .agent { fill: #eff6ff; stroke: #2563eb; }
      .vault { fill: #ecfdf5; stroke: #15803d; }
      .app { fill: #fff7ed; stroke: #c2410c; }
      .image { fill: #fefce8; stroke: #a16207; }
      .svc { fill: #faf5ff; stroke: #7e22ce; }
      .secret { fill: #fdf2f8; stroke: #be185d; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 17px Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, sans-serif; fill: #475569; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .green { stroke: #15803d; marker-end: url(#arrow-green); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <text class="title" x="42" y="48">Jenkins + Vault + Helm Lab Architecture</text>
  <text class="small" x="42" y="72">Local macOS Apple Silicon lab using Docker Desktop, kind, Jenkins, Vault dev mode, and Helm</text>

  <rect class="github box" x="44" y="116" width="212" height="98"/>
  <text class="label" x="70" y="148">GitHub Repository</text>
  <text class="small" x="70" y="173">jenkins-vault-helm-lab</text>
  <text class="tiny" x="70" y="194">Jenkinsfile, Helm chart, app code</text>

  <rect class="boundary" x="315" y="104" width="890" height="650" rx="12"/>
  <text class="section" x="340" y="136">Docker Desktop: kind cluster `devops-lab`</text>
  <text class="tiny" x="340" y="156">Kubernetes API, namespaces, pods, services, secrets, and local images loaded into kind</text>

  <rect class="namespace" x="344" y="180" width="260" height="250" rx="10"/>
  <text class="section" x="364" y="210">Namespace: jenkins</text>

  <rect class="jenkins box" x="374" y="235" width="200" height="78"/>
  <text class="label" x="398" y="265">Jenkins Controller</text>
  <text class="small" x="398" y="288">svc/jenkins :8080</text>
  <text class="tiny" x="398" y="305">Helm release `jenkins`</text>

  <rect class="agent box" x="374" y="338" width="200" height="66"/>
  <text class="label" x="398" y="365">Jenkins Agent Pod</text>
  <text class="small" x="398" y="386">jenkins-ci-toolbox:v1</text>

  <rect class="namespace" x="646" y="180" width="245" height="250" rx="10"/>
  <text class="section" x="666" y="210">Namespace: vault</text>

  <rect class="vault box" x="676" y="244" width="185" height="92"/>
  <text class="label" x="712" y="274">Vault Dev Server</text>
  <text class="small" x="712" y="297">svc/vault :8200</text>
  <text class="tiny" x="712" y="316">secret/python-app</text>

  <rect class="namespace" x="933" y="180" width="235" height="250" rx="10"/>
  <text class="section" x="953" y="210">Kubernetes API</text>

  <rect class="svc box" x="963" y="244" width="175" height="72"/>
  <text class="label" x="993" y="273">TokenReview API</text>
  <text class="small" x="993" y="295">auth-delegator RBAC</text>

  <rect class="svc box" x="963" y="340" width="175" height="66"/>
  <text class="label" x="994" y="367">apps RBAC</text>
  <text class="small" x="994" y="388">jenkins-deployer</text>

  <rect class="namespace" x="344" y="470" width="520" height="230" rx="10"/>
  <text class="section" x="364" y="500">Namespace: apps</text>

  <rect class="app box" x="374" y="530" width="176" height="88"/>
  <text class="label" x="407" y="559">Deployment</text>
  <text class="small" x="407" y="581">python-app</text>
  <text class="tiny" x="407" y="600">image: python-vault-lab:v1</text>

  <rect class="svc box" x="584" y="530" width="130" height="88"/>
  <text class="label" x="616" y="559">Service</text>
  <text class="small" x="616" y="581">python-app</text>
  <text class="tiny" x="616" y="600">ClusterIP :8080</text>

  <rect class="secret box" x="738" y="530" width="100" height="88"/>
  <text class="label" x="760" y="559">Secret</text>
  <text class="small" x="760" y="581">DB_USER</text>
  <text class="tiny" x="760" y="600">DB_PASSWORD</text>

  <rect class="image box" x="910" y="515" width="230" height="130"/>
  <text class="label" x="946" y="545">Local Images in kind</text>
  <text class="small" x="946" y="573">python-vault-lab:v1</text>
  <text class="small" x="946" y="596">jenkins-ci-toolbox:v1</text>
  <text class="tiny" x="946" y="622">Built locally, loaded with kind</text>

  <rect class="box" x="44" y="535" width="212" height="132"/>
  <text class="label" x="88" y="565">Developer Browser</text>
  <text class="small" x="73" y="592">Jenkins GUI: localhost:8080</text>
  <text class="small" x="73" y="614">Vault GUI: localhost:8200</text>
  <text class="small" x="73" y="636">App: localhost:8081</text>

  <path class="line" d="M 256 165 C 300 165, 319 255, 374 268"/>
  <text class="tiny" x="268" y="156">checkout SCM</text>

  <path class="line blue" d="M 474 313 L 474 338"/>
  <text class="tiny" x="491" y="329">starts agent</text>

  <path class="line green" d="M 574 369 C 620 369, 640 303, 676 291"/>
  <text class="tiny" x="598" y="352">Vault login + read secrets</text>

  <path class="line dashed" d="M 861 286 C 900 286, 925 283, 963 280"/>
  <text class="tiny" x="870" y="266">Kubernetes auth</text>

  <path class="line blue" d="M 574 383 C 630 454, 498 493, 462 530"/>
  <text class="tiny" x="506" y="468">helm upgrade --install</text>

  <path class="line green" d="M 769 336 C 775 405, 787 462, 788 530"/>
  <text class="tiny" x="793" y="443">db_user / db_password</text>

  <path class="line" d="M 714 574 L 738 574"/>
  <text class="tiny" x="683" y="646">pod reads envFrom secretRef</text>
  <path class="line" d="M 738 618 C 680 655, 525 654, 486 618"/>

  <path class="line" d="M 550 574 L 584 574"/>
  <text class="tiny" x="538" y="557">exposes</text>

  <path class="line dashed" d="M 910 565 C 842 503, 668 409, 523 404"/>
  <text class="tiny" x="711" y="485">agent image used by Jenkins pod</text>

  <path class="line dashed" d="M 910 594 C 804 650, 604 642, 500 618"/>
  <text class="tiny" x="657" y="678">app image used by Deployment</text>

  <path class="line dashed" d="M 256 574 C 300 510, 343 313, 374 282"/>
  <path class="line dashed" d="M 256 603 C 410 442, 591 354, 676 301"/>
  <path class="line dashed" d="M 256 633 C 375 670, 519 627, 584 591"/>
  <text class="tiny" x="62" y="698">Port-forward access from the developer machine to cluster services</text>

  <rect class="box" x="930" y="690" width="238" height="42"/>
  <text class="tiny" x="946" y="715">Solid arrows: pipeline/runtime flow</text>
  <text class="tiny" x="946" y="730">Dashed arrows: auth, images, local access</text>
</svg>
